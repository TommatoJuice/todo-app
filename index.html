<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advanced To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>📝 Advanced To-Do App</h1>


    <div class="input-box">

        <input 
            id="taskInput" 
            type="text" 
            placeholder="Enter a new task..."
        >


        <input 
            id="dateInput" 
            type="date"
        >


        <select id="priorityInput">

            <option value="Low">
                🟢 Low Priority
            </option>

            <option value="Medium">
                🟡 Medium Priority
            </option>

            <option value="High">
                🔴 High Priority
            </option>

        </select>


        <button onclick="addTask()">
            Add Task
        </button>

    </div>



    <input
        id="search"
        type="text"
        placeholder="🔍 Search tasks..."
        oninput="searchTasks()"
    >



    <div class="filters">

        <button onclick="filterTasks('all')">
            All
        </button>


        <button onclick="filterTasks('active')">
            Active
        </button>


        <button onclick="filterTasks('done')">
            Completed
        </button>

    </div>



    <ul id="taskList"></ul>


</div>



<script src="script.js"></script>

</body>

</html>
