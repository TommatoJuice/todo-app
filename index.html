<!DOCTYPE html>
<html lang="hu">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced To-Do App</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>📝 To-Do App</h1>


<div class="input-box">

<input id="taskInput" placeholder="Új feladat...">

<input id="dateInput" type="date">


<select id="priorityInput">
<option value="Low">🟢 Alacsony</option>
<option value="Medium">🟡 Közepes</option>
<option value="High">🔴 Magas</option>
</select>


<button onclick="addTask()">
Hozzáadás
</button>

</div>



<input 
id="search"
placeholder="🔍 Keresés..."
oninput="searchTasks()"
>



<div class="filters">

<button onclick="filterTasks('all')">
Összes
</button>

<button onclick="filterTasks('active')">
Aktív
</button>

<button onclick="filterTasks('done')">
Kész
</button>

</div>



<ul id="taskList"></ul>


</div>


<script src="script.js"></script>

</body>
</html>
